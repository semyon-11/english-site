<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="title desc">
  <title id="title">Тото — обезьянка-помощник</title>
  <desc id="desc">Добрая рыжевато-коричневая обезьянка в бирюзовом свитере с раскрытой книгой.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9824d"/>
      <stop offset="1" stop-color="#98552f"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48b9b0"/>
      <stop offset="1" stop-color="#238b87"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe4bf"/>
      <stop offset="1" stop-color="#f4c997"/>
    </linearGradient>
  </defs>

  <ellipse cx="179" cy="376" rx="112" ry="13" fill="#204d50" opacity=".12"/>

  <!-- Curled tail -->
  <path d="M260 310 C315 325 340 294 329 260 C321 234 290 231 278 251"
        fill="none" stroke="#87502f" stroke-width="24" stroke-linecap="round"/>
  <path d="M260 310 C315 325 340 294 329 260 C321 234 290 231 278 251"
        fill="none" stroke="#ca8958" stroke-width="6" stroke-linecap="round"/>

  <!-- Sweater and open arms -->
  <path d="M75 358 C82 312 100 291 133 282 L227 282 C261 291 280 312 286 358
           Q180 381 75 358Z" fill="url(#shirt)" stroke="#206f6c" stroke-width="5"/>
  <path d="M100 312 C78 296 62 279 58 256 C56 242 67 232 79 237
           C94 244 100 267 123 279" fill="none" stroke="#a86239" stroke-width="25" stroke-linecap="round"/>
  <path d="M260 312 C282 294 298 278 301 255 C303 241 292 232 280 238
           C265 245 260 267 237 280" fill="none" stroke="#a86239" stroke-width="25" stroke-linecap="round"/>
  <path d="M59 253 Q56 238 69 232 Q82 228 88 242" fill="none" stroke="#d18b58" stroke-width="10" stroke-linecap="round"/>
  <path d="M300 252 Q304 238 291 232 Q278 228 272 242" fill="none" stroke="#d18b58" stroke-width="10" stroke-linecap="round"/>

  <!-- Open book -->
  <path d="M116 318 Q148 303 180 322 Q212 303 244 318 L244 356
           Q211 341 180 359 Q149 341 116 356Z"
        fill="#fff8e8" stroke="#d6a34e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M180 322 L180 358" fill="none" stroke="#d6a34e" stroke-width="3"/>
  <path d="M132 330 Q151 324 166 332 M132 340 Q151 334 166 342
