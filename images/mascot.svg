  <path d="M147 218 Q180 235 213 218 Q208 232 180 235 Q152 232 147 218Z"
        fill="#fffaf1"/>
  <path d="M165 245 Q180 250 195 245" fill="none" stroke="#d98174" stroke-width="4" stroke-linecap="round"/>

  <!-- Neck scarf -->
  <path d="M139 270 Q180 291 221 270 L212 302 Q180 315 148 302Z"
        fill="#f2c65b" stroke="#bd8d36" stroke-width="4" stroke-linejoin="round"/>
  <path d="M204 293 L231 305 L216 322 L195 301Z" fill="#f2c65b" stroke="#bd8d36" stroke-width="3"/>
</svg>