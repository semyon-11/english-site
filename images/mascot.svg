  <path d="M200 151 Q216 140 231 151" fill="none" stroke="#693b2a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="145" cy="166" rx="10" ry="14" fill="#38251f"/>
  <ellipse cx="215" cy="166" rx="10" ry="14" fill="#38251f"/>
  <circle cx="149" cy="160" r="4" fill="#fff"/>
  <circle cx="219" cy="160" r="4" fill="#fff"/>

  <!-- Cheeks and smile -->
  <ellipse cx="126" cy="194" rx="14" ry="8" fill="#e99d87" opacity=".48"/>
  <ellipse cx="234" cy="194" rx="14" ry="8" fill="#e99d87" opacity=".48"/>
  <path d="M139 211 Q180 254 221 211 Q218 248 180 251 Q142 248 139 211Z"
