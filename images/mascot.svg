  <ellipse cx="180" cy="206" rx="66" ry="43" fill="#ffedcf"/>
  <ellipse cx="180" cy="177" rx="12" ry="8" fill="#80452f"/>
  <ellipse cx="176" cy="174" rx="3" ry="2" fill="#f8d8b1"/>

