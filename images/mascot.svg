  <path d="M177 310 L183 300 L189 310 L201 312 L192 320 L194 332 L183 326 L172 332 L174 320 L165 312Z"
        fill="#f6c95d"/>

  <!-- Ears -->
  <circle cx="73" cy="176" r="48" fill="url(#fur)" stroke="#874b2b" stroke-width="5"/>
  <circle cx="287" cy="176" r="48" fill="url(#fur)" stroke="#874b2b" stroke-width="5"/>
  <circle cx="73" cy="176" r="27" fill="#e9a77e"/>
  <circle cx="287" cy="176" r="27" fill="#e9a77e"/>
  <circle cx="73" cy="176" r="14" fill="#f4c69d" opacity=".8"/>
  <circle cx="287" cy="176" r="14" fill="#f4c69d" opacity=".8"/>

  <!-- Head -->
  <path d="M85 176 C79 108 123 54 180 53 C238 52 282 107 276 176
