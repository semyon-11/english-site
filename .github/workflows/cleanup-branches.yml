name: Очистка старых веток

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Удалены старые ветки'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });
            const failures = [];
            const removed = [];

            for (const branch of branches) {
              if (branch.name === "main") continue;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: "heads/" + branch.name
                });
                removed.push(branch.name);
              } catch (error) {
                failures.push(branch.name + ": " + error.message);
              }
            }

            if (failures.length) {
              core.setFailed(failures.join("\n"));
              return;
            }

            const path = ".github/workflows/cleanup-branches.yml";
            const file = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: "main"
            });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: "Удалён временный файл очистки",
              sha: file.data.sha,
              branch: "main"
            });
            core.info("Удалены ветки: " + removed.join(", "));
