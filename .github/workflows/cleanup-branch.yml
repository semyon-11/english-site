name: Удаление временной ветки

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Удалена временная ветка'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            for (const branch of branches) {
              if (branch.name === "main") continue;
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: "heads/" + branch.name
              });
            }

            const mainRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/main"
            });
            const current = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: mainRef.data.object.sha
            });
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: current.data.tree.sha,
              tree: [{
                path: ".github/workflows/cleanup-branch.yml",
                mode: "100644",
                type: "blob",
                sha: null
              }]
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: "Убран временный файл",
              tree: tree.data.sha,
              parents: [current.data.sha]
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: "heads/main",
              sha: commit.data.sha,
              force: false
            });
            core.info("Осталась только ветка main.");
