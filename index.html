<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English for Kids</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>English for Kids</h1>
            <p>Учим английский — 2 класс</p>
        </header>

    <nav class="main-nav" id="mainNav">
        <button class="nav-btn" onclick="showSection('grammar')">Грамматика</button>
        <button class="nav-btn" onclick="showSection('reading')">Чтение</button>
        <button class="nav-btn" onclick="showSection('vocabulary')">Лексика</button>
        <button class="nav-btn" onclick="showProgress()" style="background-color: #28a745;">Мой прогресс</button>
    </nav>

    <div id="nameModal" class="modal hidden">
        <div class="modal-content">
            <h2>Добро пожаловать!</h2>
            <p>Введите ваше имя:</p>
            <input type="text" id="studentName" class="fill-input" placeholder="Ваше имя" style="width: 100%; margin: 10px 0;">
            <button class="nav-btn" onclick="saveName()" style="width: 100%;">Начать обучение</button>
        </div>
    </div>

        <div id="topicsList" class="topics-list"></div>
        <div id="exercises" class="exercises"></div>
        <button id="backBtn" class="back-btn hidden" onclick="goBack()">Назад</button>
    </div>

    <script src="js/content.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/exercise-generators.js"></script>
    <script src="js/exercises.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
