<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Интерактивный тренажёр английского языка для учеников начальной школы.">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <title>English for Kids</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="header-copy">
                <h1>English for Kids</h1>
                <p>Учим английский — 2 класс</p>
            </div>
            <div class="mascot-header">
                <img
                    src="images/mascot.svg"
                    alt="Тото — дружелюбная обезьянка, талисман сайта"
                    width="132"
                    height="148"
                    decoding="async"
                >
            </div>
        </header>

        <nav class="main-nav" id="mainNav" aria-label="Основная навигация">
            <button class="nav-btn" type="button" data-action="grammar">Грамматика</button>
            <button class="nav-btn" type="button" data-action="reading">Чтение</button>
            <button class="nav-btn" type="button" data-action="vocabulary">Лексика</button>
            <button class="nav-btn nav-btn--progress" type="button" data-action="progress">Мой прогресс</button>
        </nav>

        <div id="nameModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
            <form id="nameForm" class="modal-content">
                <h2 id="nameModalTitle">Добро пожаловать!</h2>
                <p>Введите ваше имя:</p>
                <label for="studentName">Имя ученика</label>
                <input
                    type="text"
                    id="studentName"
                    name="studentName"
                    class="fill-input"
                    placeholder="Ваше имя"
                    autocomplete="given-name"
                    maxlength="40"
                    required
                    aria-describedby="nameError"
                >
                <p id="nameError" class="form-message" role="status" aria-live="polite"></p>
                <button class="nav-btn" type="submit">Начать обучение</button>
            </form>
        </div>

        <p id="storageWarning" class="storage-warning" role="status" aria-live="polite"></p>

        <main id="mainContent">
            <div id="topicsList" class="topics-list"></div>
            <div id="exercises" class="exercises"></div>
            <button id="backBtn" class="back-btn hidden" type="button">Назад</button>
        </main>
    </div>

    <script src="js/content.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/exercise-generators.js"></script>
    <script src="js/mascot.js"></script>
    <script src="js/exercises.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
